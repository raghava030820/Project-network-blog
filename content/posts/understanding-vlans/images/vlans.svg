<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1e293b">Two VLANs on one switch</text>

  <!-- Switch -->
  <rect x="300" y="60" width="160" height="60" rx="8" fill="#1e293b"/>
  <text x="380" y="96" font-size="16" fill="#e0e7ff" text-anchor="middle">Switch</text>
  <text x="380" y="145" font-size="13" fill="#64748b" text-anchor="middle">802.1Q trunk</text>
  <line x1="380" y1="120" x2="380" y2="170" stroke="#6366f1" stroke-width="2"/>

  <!-- VLAN 10 -->
  <g>
    <rect x="60" y="170" width="300" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="210" y="200" font-size="15" fill="#4338ca" text-anchor="middle">VLAN 10 — Engineering</text>
    <rect x="100" y="220" width="90" height="44" rx="6" fill="#c7d2fe"/>
    <text x="145" y="248" font-size="13" fill="#1e1b4b" text-anchor="middle">PC-A</text>
    <rect x="230" y="220" width="90" height="44" rx="6" fill="#c7d2fe"/>
    <text x="275" y="248" font-size="13" fill="#1e1b4b" text-anchor="middle">PC-B</text>
    <text x="210" y="300" font-size="12" fill="#4338ca" text-anchor="middle">10.0.10.0/24</text>
  </g>

  <!-- VLAN 20 -->
  <g>
    <rect x="400" y="170" width="300" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="550" y="200" font-size="15" fill="#047857" text-anchor="middle">VLAN 20 — Guest</text>
    <rect x="440" y="220" width="90" height="44" rx="6" fill="#a7f3d0"/>
    <text x="485" y="248" font-size="13" fill="#064e3b" text-anchor="middle">Laptop</text>
    <rect x="570" y="220" width="90" height="44" rx="6" fill="#a7f3d0"/>
    <text x="615" y="248" font-size="13" fill="#064e3b" text-anchor="middle">Phone</text>
    <text x="550" y="300" font-size="12" fill="#047857" text-anchor="middle">10.0.20.0/24</text>
  </g>
</svg>
