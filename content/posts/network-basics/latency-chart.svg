<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#f8fafc"/>

  <text x="30" y="36" font-size="18" font-weight="bold" fill="#1e293b">Average latency by hop (ms)</text>

  <line x1="60" y1="260" x2="730" y2="260" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="60" x2="60" y2="260" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Bars -->
  <g>
    <rect x="100" y="210" width="80" height="50" rx="4" fill="#6366f1"/>
    <text x="140" y="200" font-size="13" fill="#334155" text-anchor="middle">4</text>
    <text x="140" y="280" font-size="13" fill="#64748b" text-anchor="middle">Router</text>
  </g>
  <g>
    <rect x="240" y="180" width="80" height="80" rx="4" fill="#818cf8"/>
    <text x="280" y="170" font-size="13" fill="#334155" text-anchor="middle">11</text>
    <text x="280" y="280" font-size="13" fill="#64748b" text-anchor="middle">Switch</text>
  </g>
  <g>
    <rect x="380" y="150" width="80" height="110" rx="4" fill="#a5b4fc"/>
    <text x="420" y="140" font-size="13" fill="#334155" text-anchor="middle">18</text>
    <text x="420" y="280" font-size="13" fill="#64748b" text-anchor="middle">Firewall</text>
  </g>
  <g>
    <rect x="520" y="90" width="80" height="170" rx="4" fill="#c7d2fe"/>
    <text x="560" y="80" font-size="13" fill="#334155" text-anchor="middle">42</text>
    <text x="560" y="280" font-size="13" fill="#64748b" text-anchor="middle">Internet</text>
  </g>
</svg>
