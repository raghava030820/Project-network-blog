<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Internet cloud -->
  <g transform="translate(400,70)">
    <ellipse cx="0" cy="0" rx="110" ry="48" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="6" fill="#e0e7ff" font-size="20" text-anchor="middle">Internet</text>
  </g>

  <!-- Router -->
  <g transform="translate(400,190)">
    <rect x="-90" y="-32" width="180" height="64" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="7" fill="#e0e7ff" font-size="18" text-anchor="middle">Router</text>
    <text x="0" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">192.168.0.1</text>
  </g>

  <!-- Switch -->
  <g transform="translate(400,310)">
    <rect x="-110" y="-28" width="220" height="56" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="6" fill="#e0e7ff" font-size="18" text-anchor="middle">Switch</text>
  </g>

  <!-- Hosts -->
  <g fill="#0f172a">
    <g transform="translate(150,410)">
      <rect x="-55" y="-26" width="110" height="48" rx="8" fill="#334155" stroke="#a5b4fc"/>
      <text x="0" y="4" fill="#e0e7ff" font-size="14" text-anchor="middle">PC-1</text>
    </g>
    <g transform="translate(400,410)">
      <rect x="-55" y="-26" width="110" height="48" rx="8" fill="#334155" stroke="#a5b4fc"/>
      <text x="0" y="4" fill="#e0e7ff" font-size="14" text-anchor="middle">PC-2</text>
    </g>
    <g transform="translate(650,410)">
      <rect x="-55" y="-26" width="110" height="48" rx="8" fill="#334155" stroke="#a5b4fc"/>
      <text x="0" y="4" fill="#e0e7ff" font-size="14" text-anchor="middle">PC-3</text>
    </g>
  </g>

  <!-- Links -->
  <g stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="400" y1="118" x2="400" y2="158"/>
    <line x1="400" y1="222" x2="400" y2="282"/>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="310" y1="338" x2="150" y2="384"/>
    <line x1="400" y1="338" x2="400" y2="384"/>
    <line x1="490" y1="338" x2="650" y2="384"/>
  </g>
</svg>
