baseURL = 'https://raghava030820.github.io/Project-network-blog/'
locale = 'en-us'
title = 'Routing-table'
theme = 'PaperMod'

enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[params]
  description = "A blog built with Hugo and PaperMod"
  author = "Hanuven"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "Hi there"
    Content = "Welcome to my network blog."

[markup]
  [markup.highlight]
    noClasses = false

  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    name = "Posts"
    pageRef = "posts"
    weight = 10

  [[menu.main]]
    name = "Tags"
    pageRef = "tags"
    weight = 20

  [[menu.main]]
    name = "Search"
    url = "search"
    weight = 30
